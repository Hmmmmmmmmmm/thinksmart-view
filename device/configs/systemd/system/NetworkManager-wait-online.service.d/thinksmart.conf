# NetworkManager never reports "startup complete" on CD-18781Y, so stock "nm-online -s"
# always ran into its 60 s timeout and delayed services ordered after network-online.target
# (thinksmart-client, qqmusic, intercom tunnel) by ~55 s at boot.
# Wait for an actual connection instead (Wi-Fi is up ~20 s after boot).
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -q -t 60
